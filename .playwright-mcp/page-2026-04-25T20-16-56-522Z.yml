- generic [ref=e2]: "# Agario RL experiment This repository is a reinforcement learning lab built around a deterministic Agar.io-style world. You can train a shared PPO policy, observe it in the Raylib cockpit, evaluate checkpoints, train against stronger scripted and frozen opponents, and play directly against the trained agents in a dedicated human mode. ## Copy-paste commands If you only want the commands, start here. ### Create and activate the venv ```powershell python -m venv .venv ``` ```powershell .\\.venv\\Scripts\\Activate.ps1 ``` ### Install the project ```powershell python -m pip install -e .[dev] ``` ### Optional: install Intel Arc XPU wheels ```powershell python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/xpu ``` ### Optional: verify Intel Arc detection ```powershell python -c \"import torch; print(torch.xpu.is_available())\" ``` ### Train from scratch ```powershell python scripts/train.py --updates 20 --device auto ``` ### Train with the scenario curriculum ```powershell python scripts/train.py --updates 20 --scenario-preset agario_curriculum --continuing-respawn --device auto ``` ### Resume the main checkpoint ```powershell python scripts/train.py --resume --updates 500 --checkpoint checkpoints/latest.pt --device auto ``` ### Open the observer cockpit ```powershell python scripts/supervise.py --load-checkpoint ``` ### Watch training in the large arena cockpit ```powershell python scripts/supervise.py --watch-training --scenario-preset full_arena --render-detail high ``` ### Run a no-save showcase demo ```powershell python scripts/showcase.py ``` ### Play against the current agents ```powershell python scripts/play.py --checkpoint checkpoints/latest.pt ``` ### Evaluate the current checkpoint ```powershell python scripts/eval.py --checkpoint checkpoints/latest.pt --episodes 5 --deterministic --device auto ``` ### Train the mixed-opponent human-ready run ```powershell python scripts/train_human_ready.py --updates 80 --device auto ``` ### Resume the mixed-opponent human-ready run ```powershell python scripts/train_human_ready.py --resume --updates 160 --checkpoint checkpoints/human_ready_v1/latest.pt --checkpoint-dir checkpoints/human_ready_v1 --metrics-csv logs/human_ready_v1_train_metrics.csv --opponent-checkpoint checkpoints/checkpoint_00500.pt --device cpu --inference-device cpu ``` ### Evaluate human-readiness ```powershell python scripts/eval_human_readiness.py --checkpoint checkpoints/human_ready_v1/latest.pt --episodes 20 --device auto ``` ### Benchmark CPU versus Intel Arc ```powershell python scripts/benchmark_perf.py --mode train --updates 2 --device cpu ``` ```powershell python scripts/benchmark_perf.py --mode train --updates 2 --device xpu ``` ## Current project state As of April 21, 2026, the repo includes: - the original self-play checkpoint line continued from update `366` to update `500` - a fresh `human_ready_v1` retrain from scratch against a mixed opponent pool - human-readiness proxy metrics that measure corner camping, threat response, and pressure on smaller targets - Intel Arc / XPU support in the training and evaluation entrypoints - an optional Agar.io-style simulator upgrade with viruses, ejected mass, mass decay, continuing respawn, richer observation features, reward breakdowns, and a scenario-curriculum preset - an arena-first Raylib cockpit that can show viruses, ejected mass, agent intent, leaderboard, minimap, compact training metrics, scenario state, and per-agent reward components ## Project overview The project keeps the default experiment contract intentionally stable. Classic training still uses the same reset, step, continuous action, and shared-policy PPO entrypoints. The newer simulator mechanics are additive and activate through config fields, the staged `--scenario-preset agario_curriculum` flag, or the large `--scenario-preset full_arena` flag. - Deterministic 2D world simulation with pellets, split, merge, and cell eating. - Optional Agar.io-style mechanics for viruses, ejected mass feeding, mass decay, continuing respawn, and scenario-based virus unlocks. - Shared-parameter PPO with GAE, entropy regularization, and peer imitation. - Async training support for the observer cockpit. - Raylib observer cockpit for live control, telemetry, reward breakdowns, agent intent, scenario state, and checkpointing. - Dedicated human-play mode with `1` player and `2` trained agents. - Mixed-opponent training against the frozen `500` checkpoint plus scripted bots. - Human-readiness proxy metrics for threat response and anti-corner behavior. - Publication-ready Markdown files and local chart assets under `docs/`. ## Repository layout The codebase is small enough to inspect end to end. These folders and scripts matter most when you run or extend the experiment. - `agario_rl/env/`: deterministic world simulation and environment wrapper. - `agario_rl/rl/`: policy network, PPO trainer, imitation buffer, and async worker. - `agario_rl/rendering/`: Raylib observer cockpit renderer and immutable frame models. - `agario_rl/supervisor/`: cockpit controller, semantic commands, and runtime stats. - `agario_rl/play/`: human input adapter and headless-ready human-vs-bots session wrapper. - `agario_rl/utils/device.py`: torch device detection with Intel XPU support. - `scripts/train.py`: headless training entrypoint with resume-to-target milestone support and scenario-preset flags. - `scripts/showcase.py`: no-save full-arena demo for visitors and quick smoke checks. - `scripts/supervise.py`: interactive observer cockpit entrypoint with watch-training and render-detail flags. - `scripts/play.py`: human-playable mode against the trained agents. - `scripts/eval.py`: deterministic checkpoint evaluation. - `scripts/train_human_ready.py`: fresh training against scripted and frozen opponents. - `scripts/eval_human_readiness.py`: proxy evaluation for human-vs-agent readiness. - `scripts/generate_report_assets.py`: chart generation for documentation. - `docs/`: experiment report, blog draft, and reference docs. ## Install notes Start in the project root, create a virtual environment, and install the project in editable mode. ```powershell python -m venv .venv ``` ```powershell .\\.venv\\Scripts\\Activate.ps1 ``` ```powershell python -m pip install -e .[dev] ``` The interactive runtime and play mode depend on the `raylib` Python package, which is imported through `pyray`. If you want to test Intel Arc acceleration, install the XPU wheels in the project venv and verify detection: ```powershell python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/xpu ``` ```powershell python -c \"import torch; print(torch.xpu.is_available())\" ``` The trainer now supports `--device xpu`, but this repo is still heavily rollout-bound, so GPU is not automatically faster. ## Main workflows The project supports nine common flows: fresh training, scenario-curriculum training, resumed training, no-save showcase, supervision, watch-training supervision, play mode, mixed-opponent retraining, and evaluation. ### Train from scratch Run a fresh sequence that starts at update `1`. ```powershell python scripts/train.py --updates 20 --device auto ``` This command writes: - canonical metrics to `logs/train_metrics.csv` - numbered checkpoints to `checkpoints/checkpoint_*.pt` - the latest training state to `checkpoints/latest.pt` ### Train with the scenario curriculum Use the scenario preset when you want the upgraded environment instead of the classic baseline. ```powershell python scripts/train.py --updates 20 --scenario-preset agario_curriculum --continuing-respawn --device auto ``` This command keeps the same public environment API, but it turns on richer training signals: - viruses and ejected mass feeding - mass decay and continuing respawn - additive observation features for threats, targets, viruses, and readiness - reward terms for threat escape, target pressure, corner avoidance, survival quality, virus splits, and respawn penalties - staged scenario names from `pellet_growth` through `full_arena` It writes to the same default outputs as classic training: `logs/train_metrics.csv`, `checkpoints/checkpoint_*.pt`, and `checkpoints/latest.pt`. ### Resume to a target milestone Continue a saved checkpoint without resetting the update counter. ```powershell python scripts/train.py --resume --updates 500 --checkpoint checkpoints/latest.pt --device auto ``` If the checkpoint already stores `update_count=366`, this command runs updates `367` through `500`, updates `checkpoints/latest.pt`, and writes `checkpoints/checkpoint_00500.pt`. ### Open the observer cockpit Use the observer cockpit when you want to inspect behavior, step the simulation, or continue training interactively. ```powershell python scripts/supervise.py --load-checkpoint ``` The cockpit uses the same canonical metrics file as headless training, so new interactive updates append cleanly instead of starting a second numbering series. ### Watch training in the large arena cockpit Use watch-training mode when you want training to stay visible while the large Agar.io-style arena runs. ```powershell python scripts/supervise.py --watch-training --scenario-preset full_arena --render-detail high ``` These flags mean: - `--watch-training`: forces training mode on in the supervisor loop - `--scenario-preset full_arena`: starts the large 2000-style arena with more agents, more pellets, viruses, ejected mass, and continuing respawn - `--scenario-preset agario_curriculum`: enables the upgraded mechanics and staged scenario curriculum - `--continuing-respawn`: respawns eliminated agents instead of ending the episode on each elimination when you are not using `full_arena` - `--render-detail high`: shows the richer cockpit overlays, including labels, grid, score chip, viruses, ejected mass, and agent intent arrows Use `--render-detail low` when you want fewer overlays and a quieter viewport. ### Run a no-save showcase Use the showcase when you want to present the experiment without writing checkpoints or logs. It opens the large arena, uses the human-ready checkpoint when it can load, and falls back to the scripted opponent pool when it cannot. ```powershell python scripts/showcase.py ``` For CI or a quick smoke test, run it headless: ```powershell python scripts/showcase.py --headless --seconds 5 --checkpoint checkpoints/missing_showcase.pt ``` ### Play against the trained agents Use play mode when you want a human-readable feel check without changing the trained-agent interface. ```powershell python scripts/play.py --checkpoint checkpoints/latest.pt ``` The current play controls are: - move the mouse to steer - press `Space` to split - press `Enter` to restart after death or at the end of a round The player no longer gets a human-only eject action in default play mode. That older setup gave the human a tactical option the RL agents had never been trained to answer, which made the comparison unfair. ### Evaluate the current checkpoint Use evaluation when you want a deterministic score pass against the saved policy. ```powershell python scripts/eval.py --checkpoint checkpoints/latest.pt --episodes 5 --deterministic --device auto ``` ### Train against stronger opponents Use the mixed-opponent training path when you want to train against something closer to what a human exposes. ```powershell python scripts/train_human_ready.py --updates 80 --device auto ``` If you want to continue the current `human_ready_v1` checkpoint instead of starting a fresh run, use: ```powershell python scripts/train_human_ready.py --resume --updates 160 --checkpoint checkpoints/human_ready_v1/latest.pt --checkpoint-dir checkpoints/human_ready_v1 --metrics-csv logs/human_ready_v1_train_metrics.csv --opponent-checkpoint checkpoints/checkpoint_00500.pt --device cpu --inference-device cpu ``` This run trains a fresh learner from scratch against: - the frozen `checkpoint_00500.pt` policy - an Agar-style objective bot that survives first, grows second, and splits on close weak targets - a pellet-foraging scripted bot - a threat-aware evasive scripted bot - an opportunistic hunter scripted bot The latest mixed-opponent checkpoint is written to `checkpoints/human_ready_v1/latest.pt`. ### Evaluate human-readiness Use the proxy evaluator when you want metrics that are more aligned with human matches than raw PPO loss. ```powershell python scripts/eval_human_readiness.py --checkpoint checkpoints/human_ready_v1/latest.pt --episodes 20 --device auto ``` The current proxy metrics are: - `win_rate`: mixed-opponent episode wins - `mean_survival_steps`: average lifetime before elimination or timeout - `mean_final_mass`: how much space and resource control the agent converts into by episode end - `corner_time_fraction`: how often the agent hides in corners - `threat_avoidance_rate`: how often it increases distance from nearby larger threats - `small_target_pressure_rate`: how often it closes distance on nearby smaller targets ### Benchmark rollout time versus PPO update time Use the training benchmark before assuming GPU will help. ```powershell python scripts/benchmark_perf.py --mode train --updates 2 --device cpu ``` ```powershell python scripts/benchmark_perf.py --mode train --updates 2 --device xpu ``` On this project, the most important question is not \"is XPU available?\" It is \"is rollout collection or PPO update time dominant?\" The benchmark prints both numbers separately. ### Regenerate publication assets Use the asset generator when you want to rebuild the local charts used by the experiment report and the blog draft. ```powershell python scripts/generate_report_assets.py --baseline-eval -2.211 --final-eval -6.284 ``` ## Latest experiment snapshot The current repository includes four reportable milestones. | Milestone | Source | Quick read | | --- | --- | --- | | Update `366` | `checkpoints/latest.pt` before continuation | High value loss, publishable baseline snapshot, deterministic 5-episode average return `-2.211` | | Update `500` | continued run on April 2, 2026 | Lower final losses, new numbered checkpoint, deterministic 5-episode average return `-6.284` | | `human_ready_v1` update `80` | fresh retrain against mixed opponents | Better pressure on smaller targets and slightly better threat response, but still no wins and too much corner camping | | Intel Arc speed pass | `.venv` with `torch 2.11.0+xpu` | Arc support works on this laptop, but the current workload is still CPU-faster overall | Read the full interpretation in [docs/experiment-results.md](docs/experiment-results.md). ## Documentation map The documentation is split by job rather than by audience guesswork. - [docs/quickstart.md](docs/quickstart.md): shortest path to install, train, supervise, play, and evaluate. - [docs/experiment-results.md](docs/experiment-results.md): milestone-based experiment report with the `100`, `300`, `366`, `500`, and `human_ready_v1` observations. - [docs/blog-case-study.md](docs/blog-case-study.md): hybrid technical and build-story blog draft with local chart assets. - [docs/controls_and_tuning.md](docs/controls_and_tuning.md): observer cockpit controls and config tuning. - [docs/runtime_architecture.md](docs/runtime_architecture.md): snapshot-driven runtime design. - [docs/how_it_learns.md](docs/how_it_learns.md): concise PPO and imitation overview. ## Notes about the current metrics history The canonical CSV is intentionally honest about what exists and what does not. The repository has logged updates `1..200` and `367..500`. Updates `201..366` were produced during an older interactive phase that advanced the checkpoint without writing every update to the CSV. The repo does not fabricate that missing segment. Instead, the experiment report preserves the update `366` checkpoint metrics and evaluation summary as their own milestone. ## Next steps If you want to keep pushing the experiment, these are the cleanest next moves. 1. Compare `checkpoints/latest.pt` and `checkpoints/human_ready_v1/latest.pt` in both play mode and the new human-readiness evaluator. 2. Increase opponent diversity or the number of mixed-opponent training updates before claiming the agent is strong against humans. 3. If you tune the reward or curriculum again, preserve the current observation/action contract so future blog updates stay comparable."